services:
  # Backend API Web Service
  - type: web
    name: primetrade-backend
    runtime: node
    repo: https://github.com/GoyalParas/primetrade_assignment # Users will replace this with their repo
    plan: free
    buildCommand: cd backend && npm install && npx prisma generate
    startCommand: cd backend && npx prisma db push --accept-data-loss && npx prisma db seed && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: primetrade-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "https://update-me-in-dashboard.com" # You will replace this with your actual frontend URL in the Render dashboard

  # Frontend Static Site
  - type: web
    name: primetrade-frontend
    runtime: static
    repo: https://github.com/GoyalParas/primetrade_assignment # Users will replace this with their repo
    buildCommand: cd frontend && npm install --legacy-peer-deps && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: "UPDATE_ME_IN_DASHBOARD" # You will replace this with your actual backend URL in the Render dashboard
    # SPA routing rewrite rule to redirect all routes to index.html
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  # PostgreSQL Database Instance
  - name: primetrade-postgres
    plan: free
